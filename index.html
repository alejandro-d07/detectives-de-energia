<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Juego bilingüe para que niños de 5 a 10 años aprendan a ahorrar energía en casa.">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Detectives de Energía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: game stage on the left, live scoreboard on the right; stacks on phones. One sunny daytime look, by choice. */
:root{
  --sky:#d9f1ff;      /* page ground */
  --paper:#ffffff;    /* panels */
  --ink:#1d2a4d;      /* text, outlines */
  --muted:#4f5f86;
  --line:#b9d6ee;
  --sun:#ffc93c;      /* accent: energy */
  --sun-ink:#7a5200;
  --good:#1f9e5b;
  --waste:#e8463b;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:16px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.bolt{width:44px;height:44px;flex:none}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4.6vw,40px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.tag{margin:4px 0 0;color:var(--muted);font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:var(--body)}
.chip{font-weight:700;font-size:14px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink)}
.stage{position:relative;overflow:hidden;min-width:0}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 14px;border-bottom:3px solid var(--ink);background:#fff8e1}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat b{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stat.low b{color:var(--waste)}
.meter{display:flex;align-items:center;gap:8px;margin-left:auto}
.meter svg{width:86px;height:50px}
.meter span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;max-width:90px;line-height:1.2}
.scene{display:block;width:100%;height:auto;aspect-ratio:800/480;background:#bfe6ff;touch-action:manipulation}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:3px solid var(--ink);flex-wrap:wrap;min-height:64px}
.msg{flex:1 1 260px;min-width:0;font-weight:600;font-size:16px}
.msg.good{color:var(--good)} .msg.bad{color:var(--waste)}
.btn{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.02em;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 18px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff}
.btn.small{font-size:16px;padding:6px 12px}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,.badge-opt:focus-visible{outline:3px solid #2b7bff;outline-offset:2px}
.scene .hot{cursor:pointer}
.scene .hot:focus{outline:none}
.scene .hot:focus-visible .hit{stroke:#2b7bff;stroke-width:4;stroke-dasharray:8 6}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(217,241,255,.92);overflow:auto}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:20px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 5px 0 var(--ink)}
.card h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1.05;text-wrap:balance}
.card p{margin:0}
label.lbl{font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input[type=text]{font-family:var(--body);font-size:20px;font-weight:600;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;width:100%;color:var(--ink);background:#fff}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge-opt{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;background:#fff}
.badge-opt[aria-pressed="true"]{box-shadow:0 0 0 4px var(--sun),0 0 0 7px var(--ink)}
.badge-opt svg{width:34px;height:34px}
.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:46px;height:46px}
.big{font-family:var(--display);font-size:56px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.medal-msg{background:#fff8e1;border:2px dashed var(--sun-ink);border-radius:12px;padding:10px 12px;font-weight:600;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.hidden{display:none!important}
aside{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
aside h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1}
.prize{background:#fff8e1;border:2px solid var(--sun-ink);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.prize .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--sun-ink)}
.prize p{margin:0;font-weight:600}
.prize textarea{font-family:var(--body);font-size:15px;border:2px solid var(--ink);border-radius:10px;padding:6px 8px;width:100%;resize:vertical;min-height:60px}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{display:grid;grid-template-columns:34px 26px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:#f2f8fd}
.board li.me{background:#fff1bf;outline:2px solid var(--sun-ink)}
.board .rk{font-family:var(--display);font-size:18px;text-align:center;font-variant-numeric:tabular-nums}
.board .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .tm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.board .sc{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.board svg{width:26px;height:26px;display:block}
.note{font-size:13px;color:var(--muted);margin:0}
.admin{border-top:2px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-40px);opacity:0}}
@keyframes drip{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(46px);opacity:0}}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}
.spin-slow{transform-box:fill-box;transform-origin:center;animation:spin 1.4s linear infinite}
.flow{stroke-dasharray:10 10;animation:flow .6s linear infinite}
.rise{animation:rise 1.6s ease-out infinite}
.rise.d2{animation-delay:.5s}.rise.d3{animation-delay:1s}
.drip{animation:drip 1.1s ease-in infinite}
.blink{animation:blink 1.2s steps(1) infinite}
.hinted{transform-box:fill-box;transform-origin:center;animation:pulse .5s ease-in-out 6}
.popfx{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out forwards}
@media (prefers-reduced-motion:reduce){.spin,.spin-slow,.flow,.rise,.drip,.blink,.hinted{animation:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <svg class="bolt" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="#ffc93c" stroke="#1d2a4d" stroke-width="3"/><path d="M25 7 L12 25 H21 L18 38 L32 18 H23 Z" fill="#fff" stroke="#1d2a4d" stroke-width="2.5" stroke-linejoin="round"/></svg>
      <div>
        <h1 id="t-title">Detectives de Energía</h1>
        <p class="tag" id="t-tag"></p>
      </div>
    </div>
    <div class="tools">
      <button class="chip" id="lang-es" type="button" aria-pressed="true">Español</button>
      <button class="chip" id="lang-en" type="button" aria-pressed="false">English</button>
      <button class="chip" id="snd" type="button" aria-pressed="true"></button>
    </div>
  </header>

  <div class="layout">
    <section class="panel stage" aria-live="polite">
      <div class="hud" id="hud">
        <div class="stat" id="st-time"><b id="v-time">3:00</b><span id="t-time"></span></div>
        <div class="stat"><b id="v-score">0</b><span id="t-score"></span></div>
        <div class="stat"><b id="v-fixed">0/21</b><span id="t-fixed"></span></div>
        <div class="meter">
          <svg viewBox="0 0 86 50" aria-hidden="true">
            <path d="M8 44 A35 35 0 0 1 78 44" fill="none" stroke="#e7eef6" stroke-width="10"/>
            <path d="M8 44 A35 35 0 0 1 30 12" fill="none" stroke="#1f9e5b" stroke-width="10"/>
            <path d="M30 12 A35 35 0 0 1 56 12" fill="none" stroke="#ffc93c" stroke-width="10"/>
            <path d="M56 12 A35 35 0 0 1 78 44" fill="none" stroke="#e8463b" stroke-width="10"/>
            <line id="needle" x1="43" y1="44" x2="43" y2="14" stroke="#1d2a4d" stroke-width="4" stroke-linecap="round" style="transform-origin:43px 44px;transition:transform .5s"/>
            <circle cx="43" cy="44" r="5" fill="#1d2a4d"/>
          </svg>
          <span id="t-meter"></span>
        </div>
      </div>
      <svg class="scene" id="scene" viewBox="0 0 800 480" role="img"></svg>
      <div class="bar">
        <button class="btn alt small hidden" id="back" type="button"></button>
        <div class="msg" id="msg"></div>
        <button class="btn small hidden" id="hint" type="button"></button>
      </div>

      <div class="overlay" id="ov-start">
        <form class="card" id="start-form" novalidate>
          <h2 id="t-start-h"></h2>
          <p id="t-start-p"></p>
          <label class="lbl" for="name" id="t-name"></label>
          <input type="text" id="name" maxlength="14" autocomplete="off" spellcheck="false">
          <p class="note" id="name-err" style="color:#e8463b;font-weight:600" aria-live="polite"></p>
          <span class="lbl" id="t-pick"></span>
          <div class="badges" id="badges"></div>
          <ol class="how" id="how"></ol>
          <div class="row"><button class="btn" type="submit" id="play"></button></div>
        </form>
      </div>

      <div class="overlay hidden" id="ov-end">
        <div class="card" style="text-align:center;align-items:stretch">
          <h2 id="end-h"></h2>
          <div class="stars" id="end-stars"></div>
          <div class="big" id="end-score">0</div>
          <p id="end-sub"></p>
          <div class="medal-msg hidden" id="end-medal"></div>
          <p class="note" id="end-save"></p>
          <div class="row" style="justify-content:center">
            <button class="btn" type="button" id="again"></button>
            <button class="btn alt" type="button" id="next"></button>
          </div>
        </div>
      </div>
    </section>

    <aside class="panel" aria-labelledby="t-board">
      <h2 id="t-board"></h2>
      <div class="prize">
        <span class="k" id="t-prize"></span>
        <p id="prize-text"></p>
      </div>
      <ol class="board" id="board"></ol>
      <p class="note" id="board-note"></p>
      <details class="admin" id="admin"><summary class="lbl" style="cursor:pointer" id="t-admin"></summary>
        <label class="lbl" for="prize-edit" id="t-prize-edit"></label>
        <textarea id="prize-edit" maxlength="160"></textarea>
        <div class="row">
          <button class="btn small" type="button" id="prize-save"></button>
          <button class="btn alt small" type="button" id="reset"></button>
        </div>
        <div class="row hidden" id="reset-confirm">
          <span class="note" id="t-reset-q" style="flex-basis:100%"></span>
          <button class="btn small" type="button" id="reset-yes" style="background:#e8463b;color:#fff"></button>
          <button class="btn alt small" type="button" id="reset-no"></button>
        </div>
      </details>
    </aside>
  </div>
</div>

<script>
(() => {

/* ---------------- sound ---------------- */
let AC=null, sound=true;
try{ sound = localStorage.getItem('energia-snd')!=='0'; }catch(e){}
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function tone(f,d,type='triangle',v=.12,delay=0){
  if(!AC||!sound) return;
  const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.02);
}
const SFX={good:()=>{tone(660,.12);tone(990,.18,'triangle',.12,.09);},bad:()=>{tone(220,.25,'square',.06);tone(160,.3,'square',.06,.12);},room:()=>tone(520,.08,'sine',.08),win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.12,i*.12))};

function resetState(){

}
function wasting(id){ const i=ITEMS.find(x=>x.id===id); return !i.trap && S.state[id]; }
function remaining(room){ return TARGETS.filter(i=>i.room===room && S.state[i.id]).length; }
function currentWatts(){ return TARGETS.reduce((s,i)=>s+(S.state[i.id]?i.w:0),0); }

function roomIcon(id,cx,cy){
  const c='#1d2a4d';
  if(id==='sala') return `<rect x="${cx-40}" y="${cy-14}" width="80" height="30" rx="10" fill="#4c6ef5" stroke="${c}" stroke-width="3"/><rect x="${cx-34}" y="${cy-30}" width="68" height="20" rx="8" fill="#3b5bdb" stroke="${c}" stroke-width="3"/>`;
  if(id==='cocina') return `<rect x="${cx-26}" y="${cy-40}" width="52" height="70" rx="6" fill="#f4f7fb" stroke="${c}" stroke-width="3"/><line x1="${cx-26}" y1="${cy-14}" x2="${cx+26}" y2="${cy-14}" stroke="${c}" stroke-width="3"/>`;
  if(id==='recamara') return `<rect x="${cx-50}" y="${cy-10}" width="100" height="32" rx="8" fill="#ff7aa6" stroke="${c}" stroke-width="3"/><rect x="${cx-46}" y="${cy-24}" width="30" height="16" rx="6" fill="#fff" stroke="${c}" stroke-width="3"/>`;
  if(id==='bano') return `<path d="M${cx-46} ${cy-8} h92 v10 q0 22 -24 22 h-44 q-24 0 -24 -22z" fill="#fff" stroke="${c}" stroke-width="3"/><path d="M${cx-36} ${cy-8} v-26 q0 -8 10 -8" fill="none" stroke="#9aa8bd" stroke-width="5"/>`;
  return `<rect x="${cx-30}" y="${cy-36}" width="60" height="66" rx="6" fill="#f4f7fb" stroke="${c}" stroke-width="3"/><circle cx="${cx}" cy="${cy+2}" r="18" fill="#bfe8ff" stroke="${c}" stroke-width="3"/>`;

function renderRoom(){
  const room=S.room;
  let s=decor(room);
  for(const it of ITEMS.filter(i=>i.room===room)){
    const on = it.trap ? true : S.state[it.id];
    const [hx,hy,hw,hh]=it.hit;
    s+=`<g class="hot" data-item="${it.id}" role="button" tabindex="0" aria-label="${it.label[lang]}">
      ${it.draw(on)}
      <rect class="hit" x="${hx}" y="${hy}" width="${hw}" height="${hh}" rx="12" fill="transparent"/>
    </g>`;
  }
  scene.innerHTML=s+'<g id="fx"></g>';
  scene.setAttribute('aria-label', T[lang].rooms[room]);
}

function renderHUD(){
  const m=Math.floor(S.timeLeft/60), sec=S.timeLeft%60;
  $('v-time').textContent=`${m}:${String(sec).padStart(2,'0')}`;
  $('st-time').classList.toggle('low', S.timeLeft<=30);
  $('v-score').textContent=S.score;
  $('v-fixed').textContent=`${S.fixed}/${TARGETS.length}`;
  const frac = S.screen==='play' ? currentWatts()/MAXW : 0;
  $('needle').style.transform=`rotate(${-90+180*frac}deg)`;
}
function render(){
  if(S.room) renderRoom(); else renderHouse();
  renderHUD();
  $('back').classList.toggle('hidden', !S.room || S.screen!=='play');
  $('hint').classList.toggle('hidden', !S.room || S.screen!=='play' || remaining(S.room)===0);
}
function say(text,kind=''){ const m=$('msg'); m.textContent=text; m.className='msg'+(kind?' '+kind:''); }

/* ---------------- interactions ---------------- */
function floatText(x,y,txt,color){
  const fx=scene.querySelector('#fx'); if(!fx) return;
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.innerHTML=`<text x="${x}" y="${y}" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="34" fill="${color}" stroke="#1d2a4d" stroke-width="2" paint-order="stroke" class="popfx">${txt}</text>`;
  fx.appendChild(g); setTimeout(()=>g.remove(),900);
}
function tapItem(id){
  if(S.screen!=='play') return;
  const it=ITEMS.find(i=>i.id===id); const [hx,hy,hw]=it.hit; const cx=hx+hw/2, cy=Math.max(40,hy+30);
  if(it.trap){
    S.score=Math.max(0,S.score-50); S.mistakes++; SFX.bad(); say(it.fact[lang],'bad'); renderHUD(); floatText(cx,cy,'−50','#e8463b'); return;
  }
  if(!S.state[id]) return;
  S.state[id]=false; S.fixed++;
  S.score+=100; S.fixPts+=100; SFX.good(); say(it.fact[lang],'good');
  render(); floatText(cx,cy,'+100','#1f9e5b');
  if(S.fixed===TARGETS.length){ setTimeout(()=>endGame(true),900); }
  else if(remaining(S.room)===0){ setTimeout(()=>{ if(S.screen==='play' && S.room) say(t('roomDone'),'good'); },1800); }
}
function enterRoom(id){ if(S.screen!=='play') return; S.room=id; SFX.room(); render(); say(remaining(id)?t('roomIn'):t('roomDone')); const f=scene.querySelector('.hot'); }
function leaveRoom(){ S.room=null; render(); say(t('house')); }
scene.addEventListener('click',e=>{
  audio();
  const g=e.target.closest('.hot'); if(!g) return;
  if(g.dataset.room) enterRoom(g.dataset.room); else if(g.dataset.item) tapItem(g.dataset.item);
});
scene.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const g=e.target.closest('.hot'); if(!g) return; e.preventDefault(); audio();
  const roomKey=g.dataset.room, itemKey=g.dataset.item;
  if(roomKey){ enterRoom(roomKey); const first=scene.querySelector('.hot'); first&&first.focus(); }
  else if(itemKey){ tapItem(itemKey); const again=scene.querySelector(`[data-item="${itemKey}"]`); again&&again.focus(); }
});
$('back').addEventListener('click',()=>{ leaveRoom(); const f=scene.querySelector('.hot'); f&&f.focus(); });
$('hint').addEventListener('click',()=>{
  if(!S.room) return;
  const it=TARGETS.find(i=>i.room===S.room && S.state[i.id]); if(!it) return;
  S.score=Math.max(0,S.score-10); renderHUD();
  const g=scene.querySelector(`[data-item="${it.id}"]`); if(g){ g.classList.remove('hinted'); void g.getBBox(); g.classList.add('hinted'); }
  say(`${t('hintMsg')} (−10)`);
});

/* ---------------- game flow ---------------- */
function startGame(){
  resetState(); S.screen='play';
  $('ov-start').classList.add('hidden'); $('ov-end').classList.add('hidden');
  render(); say(t('house'));
  clearInterval(S.timer);
  S.timer=setInterval(()=>{ if(document.hidden) return; S.timeLeft--; renderHUD(); if(S.timeLeft<=0) endGame(false); },1000);
  const f=scene.querySelector('.hot'); f&&f.focus({preventScroll:true});
}
function starsFor(){ const r=S.fixed/TARGETS.length; if(r===1 && S.mistakes===0) return 3; if(r>=.7) return 2; return S.fixed>0?1:0; }
function starSVG(on){ return `<svg viewBox="0 0 46 46" aria-hidden="true"><path d="M23 3 L29 17 L44 18 L32 28 L36 43 L23 35 L10 43 L14 28 L2 18 L17 17 Z" fill="${on?'#ffc93c':'#e7eef6'}" stroke="#1d2a4d" stroke-width="3" stroke-linejoin="round"/></svg>`; }
async function endGame(won){
  if(S.screen!=='play') return;
  clearInterval(S.timer); S.screen='end';
  const used=TOTAL_TIME-S.timeLeft;
  const timeBonus = won ? S.timeLeft*10 : 0;
  const perfect = won && S.mistakes===0 ? 200 : 0;
  S.score += timeBonus + perfect;
  if(won) SFX.win();
  renderHUD(); $('back').classList.add('hidden'); $('hint').classList.add('hidden');
  const st=starsFor();
  $('end-h').textContent=won?t('endWin'):t('endTime');
  $('end-stars').innerHTML=[0,1,2].map(i=>starSVG(i<st)).join('');
  $('end-score').textContent=S.score;
  S.lastEnd={won,used,timeBonus,perfect};
  writeEndSub();
  $('end-medal').classList.add('hidden');
  $('ov-end').classList.remove('hidden');
  $('again').focus({preventScroll:true});
  const row={name:S.name,badge:S.badge,score:S.score,stars:st,fixed:S.fixed,total:TARGETS.length,mistakes:S.mistakes,used,won,at:Date.now()};
  saveScore(row);
  $('end-save').textContent=t('saved');
  showMedal();
}
function fmt(sec){ return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; }
function writeEndSub(){
  const e=S.lastEnd; if(!e) return;
  $('end-sub').textContent=T[lang].endSub(S.fixed,TARGETS.length,S.mistakes)+' '+T[lang].endBreak(S.score-e.timeBonus-e.perfect,e.timeBonus,e.perfect,fmt(e.used));
}
function showMedal(){
  if(!S.lastResultId) return;
  const idx=boardRows.findIndex(r=>r.id===S.lastResultId);
  const m=$('end-medal');
  if(idx>=0 && idx<3){ m.textContent=T[lang].medal[idx]; m.classList.remove('hidden'); } else m.classList.add('hidden');
}

}

/* ---------------- scoreboard (this browser session only) ---------------- */
// sessionStorage survives an accidental refresh but is erased when the tab or browser is closed.
let boardRows=[], prizeText='';
const SKEY='energia-session-scores', PKEY='energia-session-prize';
try{ localStorage.removeItem('energia-scores'); }catch(e){}
function loadSession(){ try{ return JSON.parse(sessionStorage.getItem(SKEY)||'[]'); }catch(e){ return []; } }
function saveSession(rows){ try{ sessionStorage.setItem(SKEY,JSON.stringify(rows)); }catch(e){} }
function sortRows(rows){ return rows.slice().sort((a,b)=>b.score-a.score || (a.used??9999)-(b.used??9999) || a.at-b.at); }
function saveScore(row){
  const id='s'+row.at; S.lastResultId=id;
  boardRows=sortRows([...boardRows,{...row,id}]); saveSession(boardRows); renderBoard();
}
function medalSVG(i){
  const c=['#ffc93c','#cfd8e3','#d9895b'][i];
  return `<svg viewBox="0 0 26 26" aria-hidden="true"><path d="M7 1 L13 10 L19 1" fill="none" stroke="#3aa0ff" stroke-width="4"/><circle cx="13" cy="16" r="9" fill="${c}" stroke="#1d2a4d" stroke-width="2.5"/><text x="13" y="20.5" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="11" fill="#1d2a4d">${i+1}</text></svg>`;
}
function renderBoard(){
  const ol=$('board'); ol.innerHTML='';
  const rows=boardRows.slice(0,20);
  if(!rows.length){ const li=document.createElement('li'); li.style.gridTemplateColumns='1fr'; li.textContent=t('empty'); ol.appendChild(li); }
  rows.forEach((r,i)=>{
    const li=document.createElement('li'); if(r.id===S.lastResultId) li.className='me';
    const rk=document.createElement('span'); rk.className='rk'; if(i<3) rk.innerHTML=medalSVG(i); else rk.textContent=i+1;
    const bd=document.createElement('span'); bd.innerHTML=badgeSVG(BADGES[(+r.badge||0)%BADGES.length]);
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=String(r.name||'?').slice(0,14);
    const tm=document.createElement('span'); tm.className='tm'; tm.textContent=r.won?fmt(r.used):'—';
    const sc=document.createElement('span'); sc.className='sc'; sc.textContent=Number(r.score)||0;
    li.append(rk,bd,nm,tm,sc); ol.appendChild(li);
  });
  $('board-note').textContent=t('session');
}
function renderPrize(){ $('prize-text').textContent = prizeText || t('prizeDefault'); }
function initSession(){
  boardRows=sortRows(loadSession());
  try{ prizeText=sessionStorage.getItem(PKEY)||''; }catch(e){}
  $('prize-edit').value=prizeText;
  renderBoard(); renderPrize();
}
$('prize-save').addEventListener('click',()=>{
  prizeText=$('prize-edit').value.trim().slice(0,160);
  try{ sessionStorage.setItem(PKEY,prizeText); }catch(e){}
  renderPrize(); $('board-note').textContent=t('prizeSaved');
});
$('reset').addEventListener('click',()=>$('reset-confirm').classList.remove('hidden'));
$('reset-no').addEventListener('click',()=>$('reset-confirm').classList.add('hidden'));
$('reset-yes').addEventListener('click',()=>{
  $('reset-confirm').classList.add('hidden');
  boardRows=[]; S.lastResultId=null; saveSession([]); renderBoard();
});
